# Use a modern default terminal description with true color support.
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

set -g escape-time 0
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h previous-window
bind -r C-l next-window

setw -g mode-keys vi
set -g status-interval 5
set -g status-position bottom
set -g status-style fg=colour250,bg=colour234
setw -g window-status-current-style fg=colour234,bg=colour39,bold
set -g message-style fg=colour234,bg=colour220,bold

set -g set-clipboard on

if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
